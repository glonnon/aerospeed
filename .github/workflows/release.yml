name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build store ZIP
        run: |
          bash package.sh dist
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AeroSpeed ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*.zip